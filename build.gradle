import org.gradle.api.attributes.java.TargetJvmVersion
import org.gradle.process.ExecOperations
import javax.inject.Inject

plugins {
    id 'java'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.5.1'
}

group 'br.com.finalcraft'
version '1.3.1'

// Run the build on the house-standard JDK 25 (Gradle 9.6.1 runs on it directly).
// compileJava below overrides to emit Java 8 bytecode via Jabel.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

repositories {
    flatDir { //Holds the per-version *-COMPAT.jar the orchestrator produces (gitignored, rebuilt each run)
        dirs 'libs'
    }
    mavenCentral()
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots'
    }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://maven.petrus.dev/public' } //EverNifeCore + the Jabel fork live here
}

dependencies {
    // Jabel fork: rides a Java 25 javac and still emits Java 8 bytecode (upstream 0.4.2 can't hook a Java 25 compiler).
    annotationProcessor 'br.com.finalcraft:jabel:1.2.0'
    compileOnly          'br.com.finalcraft:jabel:1.2.0'

    compileOnly 'org.spigotmc:spigot-api:1.19.2-R0.1-SNAPSHOT'
    compileOnly 'br.com.finalcraft:EverNifeCore:2.0.4'

    implementation project(':modules:Commons')

    // Shade every compat jar the orchestrator drops into libs/
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    compileOnly 'org.jetbrains:annotations:23.0.0'
    compileOnly 'org.projectlombok:lombok:1.18.46'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters') //Keep parameter names on the compiled jar
}

// Jabel: write modern Java syntax, emit Java 8 bytecode (mirrors EverNifeCore).
// sourceCompatibility raises javac's language gate; options.release clamps the API to Java 8 -> major 52.
configure([tasks.compileJava]) {
    sourceCompatibility = 25
    options.release = 8
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Gradle 9: a Java-8-bytecode project must still be allowed to resolve JVM-11+ dependencies,
// and must not advertise itself as "JVM 25 only". Tag only resolvable/consumable configurations
// (Gradle 9 forbids attributes on declarable-only buckets), then suppress module metadata so the
// artifact is consumed via its POM.
configurations.configureEach {
    if (canBeResolved || canBeConsumed) {
        attributes {
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
        }
    }
}
tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

// =====================================================================
//  Federated compat orchestrator
//
//  Each per-version compat module keeps its own Gradle wrapper + Forge
//  toolchain (their required Gradle versions are mutually incompatible and
//  none can run on this Gradle 9 root). This task drives each module's own
//  gradlew on the JDK that toolchain needs, then copies its *-COMPAT.jar
//  into libs/ so the root shadowJar can shade it. Machine JDK locations are
//  centralized here; adjust for a different machine.
// =====================================================================
ext.jdk8  = 'C:\\Users\\Petrus\\.jdks\\temurin-1.8.0_492'
ext.jdk17 = 'C:\\Users\\Petrus\\.jdks\\temurin-17.0.19'
ext.jdk21 = 'C:\\Users\\Petrus\\.jdks\\temurin-21.0.11'

// module dir -> [ runner: JAVA_HOME for that module's Gradle daemon, needsCommons: shade Commons at compileOnly ]
ext.compatModules = [
        'modules/v1_12_2': [runner: jdk8,  needsCommons: false], // anatawa12 FG2.3 on Gradle 4.10.3 (runs on Java 8)
        'modules/v1_16_5': [runner: jdk21, needsCommons: true],  // ForgeGradle 6 on Gradle 8.8, compiles on the Java 8 toolchain
        'modules/v1_20_2': [runner: jdk17, needsCommons: true],  // NeoGradle on Gradle 8.1.1, toolchain 17
        'modules/v1_21_1': [runner: jdk21, needsCommons: true],  // ModDevGradle on Gradle 8.14.3, toolchain 21
]

def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')

// Gradle 9 removed Project.exec{}; external processes must go through the injected ExecOperations service.
abstract class ExecHelper {
    @Inject abstract ExecOperations getExecOperations()
}
def execHelper = objects.newInstance(ExecHelper)

def runModuleGradle = { String modPath, String runnerJdk, List<String> extraArgs ->
    // Use the module wrapper's absolute path (cmd /c does not reliably resolve a bare 'gradlew.bat' by CWD).
    def wrapper = new File(projectDir, "${modPath}/${isWindows ? 'gradlew.bat' : 'gradlew'}").absolutePath
    def launcher = isWindows ? ['cmd', '/c', wrapper] : [wrapper]
    execHelper.execOperations.exec {
        workingDir new File(projectDir, modPath)
        commandLine(launcher + extraArgs + ['--no-daemon'])
        environment 'JAVA_HOME', runnerJdk
        environment 'PATH', "${runnerJdk}\\bin" + File.pathSeparator + System.getenv('PATH')
        ignoreExitValue = true
    }
}

tasks.register('buildAndMoveJars') {
    group = 'compat'
    description = 'Builds every federated compat module on its own JDK and copies its *-COMPAT.jar into libs/.'
    dependsOn ':modules:Commons:jar'
    doLast {
        file('libs').mkdirs()
        def commonsJar = tasks.getByPath(':modules:Commons:jar').archiveFile.get().asFile

        compatModules.each { modPath, cfg ->
            // Provide Commons as a plain jar (federated modules can't consume it as a Gradle project across
            // incompatible Gradle versions, so the root builds it once and drops it into their flatDir libs/).
            if (cfg.needsCommons) {
                def dst = file("${modPath}/libs/Commons.jar")
                dst.parentFile.mkdirs()
                java.nio.file.Files.copy(commonsJar.toPath(), dst.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }

            println "[COMPAT] Building ${modPath} (JAVA_HOME=${cfg.runner})"
            def result = runModuleGradle(modPath, cfg.runner, ['build'])
            if (result.exitValue != 0) {
                throw new GradleException("Compat build FAILED for ${modPath} (exit ${result.exitValue})")
            }

            def name    = modPath.substring(modPath.lastIndexOf('/') + 1)
            def jarName = "${name}-COMPAT.jar"
            def built   = file("${modPath}/build/libs/${jarName}")
            if (!built.exists()) {
                throw new GradleException("Expected ${built} was not produced by ${modPath}")
            }
            def target = file("libs/${jarName}")
            java.nio.file.Files.copy(built.toPath(), target.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            println "[COMPAT] -> libs/${jarName}"
        }
    }
}

clean {
    doLast {
        fileTree(dir: 'libs', include: '**/*-COMPAT.jar').each { it.delete() }
        compatModules.each { modPath, cfg ->
            println "[COMPAT] Cleaning ${modPath}"
            runModuleGradle(modPath, cfg.runner, ['clean'])
            delete "${modPath}/libs/Commons.jar"
        }
    }
}

// Only the shaded jar is produced.
shadowJar {
    archiveClassifier.set('')
    archiveFileName = "${project.name}-${version}.jar"
    dependsOn tasks.named('buildAndMoveJars')
}

tasks.named('jar') {
    enabled = false
}
tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

publishing {
    repositories {
        maven {
            name = 'PetrusRepo'
            url = 'https://maven.petrus.dev/public'
            credentials {
                username = System.env.PETRUSMAVEN_ACTOR
                password = System.env.PETRUSMAVEN_TOKEN
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
    publications {
        petrus(MavenPublication) {
            artifact tasks.named('shadowJar') //Publish the fat jar; deps are shaded, so the POM stays dependency-free
            pom.withXml {
                asNode().appendNode('url', 'https://petrus.dev')
            }
        }
    }
}
