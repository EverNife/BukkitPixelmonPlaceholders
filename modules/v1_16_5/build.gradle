buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        // ForgeGradle 6 is the toolchain the official MinecraftForge 1.16.x MDK ships with (Gradle 8 + JDK 8).
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.+'
    }
}

apply plugin: 'java'
apply plugin: 'net.minecraftforge.gradle'

group 'br.com.finalcraft'
version 'COMPAT'

// FG6/1.16.5 compiles against Java 8. The Gradle daemon runs on JDK 21 (set by the root orchestrator);
// the Java-8 toolchain is located via org.gradle.java.installations.paths in gradle.properties.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(8)
}

compileJava.options.encoding = 'UTF-8'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
    flatDir {
        dirs 'libs'
    }
    mavenCentral()
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots'
    }
    maven {
        url = 'https://maven.petrus.dev/public'
    }
}

minecraft {
    mappings channel: 'official', version: '1.16.5'
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.19.2-R0.1-SNAPSHOT'
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.34'
    compileOnly 'br.com.finalcraft:EverNifeCore:2.0.4'
    compileOnly name: 'Pixelmon-1.16.5-9.1.4-universal-noAssets'

    // Commons is delivered by the root orchestrator as libs/Commons.jar (flatDir) instead of a project ref,
    // because this module builds under its own (incompatible) Gradle version.
    compileOnly name: 'Commons'

    implementation 'org.apache.commons:commons-lang3:3.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.9.2'

    //Annotations
    compileOnly 'org.jetbrains:annotations:24.0.0'

    //Lombok
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    testCompileOnly 'org.projectlombok:lombok:1.18.46'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'
}

jar {
    archiveFileName = 'v1_16_5-COMPAT.jar'
}
