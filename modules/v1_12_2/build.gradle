buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        // anatawa12's ForgeGradle 2.3 fork is the only maintained way to build a 1.12.2 mod; it caps at
        // Gradle 6 and runs on Java 8, so this module stays federated on its own (old) wrapper.
        classpath 'com.anatawa12.forge:ForgeGradle:2.3-1.0.+'
    }
}

apply plugin: 'java'
apply plugin: 'net.minecraftforge.gradle.forge'

group 'br.com.finalcraft'
version 'COMPAT'

sourceCompatibility = 1.8
targetCompatibility = 1.8

compileJava.options.encoding = 'UTF-8'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
    flatDir {
        dirs 'libs'
    }
    mavenCentral()
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/groups/public/'
    }
    maven { url 'https://jitpack.io' }
    maven {
        url = 'https://maven.petrus.dev/public'
    }
}

minecraft {
    version = "1.12.2-14.23.5.2847"
    runDir = "run"

    mappings = "stable_39"
    makeObfSourceJar = false
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.19.2-R0.1-SNAPSHOT'
    compileOnly "br.com.finalcraft:EverNifeCore:2.0.4"

    compileOnly name: "Pixelmon-1.12.2-8.4.3-noassets"

    //Lombok
    compileOnly 'org.projectlombok:lombok:1.18.46'
}

jar {
    archiveName = 'v1_12_2-COMPAT.jar'
}
