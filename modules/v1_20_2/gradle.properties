# Daemon runs on JDK 17 (JAVA_HOME set by the root orchestrator) which is also the compile toolchain,
# so no extra JDK needs locating. Never provision a toolchain over the network.
org.gradle.java.installations.auto-download=false
# NeoGradle decompiles Minecraft; give it headroom (default heap OOMs under --no-daemon).
org.gradle.jvmargs=-Xmx3G
