import org.gradle.api.attributes.java.TargetJvmVersion

plugins {
    id 'java'
}

group 'br.com.finalcraft'
version 'COMMONS'

// Shared library: same Jabel-fork -> Java 8 recipe as the root plugin, no Forge/Minecraft classpath.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

repositories {
    flatDir {
        dirs 'libs'
    }
    mavenCentral()
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots'
    }
    maven { url = 'https://maven.petrus.dev/public' }
}

dependencies {
    // Jabel fork: modern syntax -> Java 8 bytecode on a Java 25 javac.
    annotationProcessor 'br.com.finalcraft:jabel:1.2.0'
    compileOnly          'br.com.finalcraft:jabel:1.2.0'

    compileOnly 'org.spigotmc:spigot-api:1.19.2-R0.1-SNAPSHOT'
    compileOnly 'br.com.finalcraft:EverNifeCore:2.0.4'
    compileOnly 'org.jetbrains:annotations:24.0.0'

    // Lombok (@Data is used in this module, so it must run as an annotation processor).
    compileOnly        'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

configure([tasks.compileJava]) {
    sourceCompatibility = 25
    options.release = 8
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Same Gradle-9 attribute/metadata handling as the root so the Commons artifact isn't tagged JVM-25-only.
configurations.configureEach {
    if (canBeResolved || canBeConsumed) {
        attributes {
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
        }
    }
}
tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}
